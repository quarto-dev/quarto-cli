# Tests a broad set of Quarto functionality that users are likely to encounter.
# A failure indicates some significant portion of functionality is likely to be broken.
name: Smoke Tests
on:
  workflow_call:
    inputs:
      buckets:
        description: "JSON array of test buckets. Empty runs the full suite."
        required: false
        type: string
        default: ""
      time-test:
        description: "Should we run tests to produce test file"
        required: false
        type: boolean
        default: false
      extra-r-packages:
        description: "extra R packages installed on top of tests/rproj.lock (like a dev version of one of the deps) - comma separated, passed to rig pkg install: pkg, owner/repo[@ref], gitlab::group/project, url::https://...; pkg@1.2.3 means exactly 1.2.3"
        required: false
        type: string
        default: ""
      quarto-install:
        description: "Quarto source: dev tree, published release, or workflow artifact"
        required: false
        type: string
        default: "dev"
      quarto-version:
        description: "Version to install when quarto-install is release"
        required: false
        type: string
        default: ""
      quarto-artifact-name:
        description: "Artifact containing the Quarto tarball or zip"
        required: false
        type: string
        default: ""
      quarto-artifact-run-id:
        description: "Run ID containing the artifact; empty uses the current run"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to check out; empty uses the default"
        required: false
        type: string
        default: ""
      runners:
        description: "JSON array of runner labels; macos-latest is reserved for scheduled built-version runs"
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      label-tag:
        description: "Short alphanumeric tag for distinguishing same-OS jobs in failure summaries"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      buckets:
        description: "JSON string for buckets of tests to run in loop. Array of grouped tests."
        required: false
        type: string
        default: ""
      time-test:
        description: "Should we run tests to produce test file"
        required: false
        type: boolean
        default: false
      extra-r-packages:
        description: "extra R packages installed on top of tests/rproj.lock (like a dev version of one of the deps) - comma separated, passed to rig pkg install: pkg, owner/repo[@ref], gitlab::group/project, url::https://...; pkg@1.2.3 means exactly 1.2.3"
        required: false
        type: string
        default: ""
      pandoc-override-version:
        description: "Pandoc release tag to download from GitHub for smoke tests before S3 archival (e.g. 3.10.1). Quarto selects it through QUARTO_PANDOC. Leave empty to use the configured binary."
        required: false
        type: string
        default: ""

# this is required to cleanup julia cache
permissions:
  actions: write
  contents: read

jobs:
  run-smokes:
    name: Run smoke (${{ matrix.os }})${{ matrix.time-test && ' with timed file' || ''}}${{ inputs.extra-r-packages && ' - with some extra R packages'|| ''}}
    if: github.event_name != 'schedule' || (github.event_name == 'schedule' && github.repository == 'quarto-dev/quarto-cli')
    strategy:
      fail-fast: false
      matrix:
        # Non-call triggers use the default runner matrix.
        os: ${{ fromJSON(inputs.runners || '["ubuntu-latest", "windows-latest"]') }}
        time-test:
          - ${{ inputs.time-test }}
        exclude:
          # only run timed tests on Linux
          - os: windows-latest
            time-test: true
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright-browsers
      RUST_BACKTRACE: ${{ startsWith(matrix.os, 'macos') && 'full' || '' }}
      # Distinguishes this call from other jobs on the same OS.
      QUARTO_TESTS_GHA_LABEL_TAG: ${{ inputs.label-tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Empty keeps the standard checkout behavior.
          ref: ${{ inputs.ref }}

      - name: Check the ref supports the rig test environment
        shell: bash
        run: |
          for f in tests/rproj.lock .github/actions/setup-rig/action.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::This checkout has no $f. The R test environment needs a ref that uses the rig project (releases before it was introduced are not supported)."
              exit 1
            fi
          done

      # macOS runners boot with an unresolvable `.local` hostname, so any process
      # resolving its own hostname stalls ~35s (actions/runner-images#14568).
      - name: Set a resolvable hostname (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo scutil --set HostName gha-runner
          echo "127.0.0.1 gha-runner" | sudo tee -a /etc/hosts

      - name: Fix temp dir to use runner one (windows)
        if: runner.os == 'Windows'
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV
          echo "TMP=${{ runner.temp }}" >> $GITHUB_ENV
          echo "TEMP=${{ runner.temp }}" >> $GITHUB_ENV
        shell: bash

      # Drops a slow azure.archive.ubuntu.com from the apt mirror list so the job uses
      # archive.ubuntu.com (actions/runner-images#14823): sampled here before setup-r,
      # and after a failed attempt in later apt steps run via $APT_WITH_FALLBACK.
      # Inline, not a local action, because release mode checks out older tags.
      - name: Configure apt mirror fallback
        if: runner.os == 'Linux'
        shell: bash
        env:
          APT_MIRROR_SAMPLE_PACKAGE: fonts-wqy-zenhei
          APT_MIRROR_MIN_SPEED: "1000000"
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          helper="$RUNNER_TEMP/apt-with-mirror-fallback.sh"
          cat > "$helper" <<'EOF'
          #!/usr/bin/env bash
          # Usage: apt-with-mirror-fallback.sh '<apt command>'
          # Runs the command as root with a per-attempt timeout; timeout runs as
          # root so the kill reaches apt and dpkg children.
          mirrors=/etc/apt/apt-mirrors.txt
          log=$(mktemp)
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            start=$SECONDS
            sudo env "PATH=$PATH" timeout --kill-after=15 180 bash -c "$1" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "Attempt $attempt exited $status after $((SECONDS - start))s; hosts served:"
            grep -oE '^(Get|Hit):[0-9]+ https?://[^/ ]+' "$log" | awk '{print $2}' | sort | uniq -c
            [ "$status" -eq 0 ] && exit 0
            if grep -q 'azure\.archive\.ubuntu\.com' "$mirrors" 2>/dev/null; then
              echo "::warning::apt attempt $attempt failed (exit $status); dropping azure.archive.ubuntu.com from $mirrors"
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
            fi
            # Finishes any install the timeout interrupted; a no-op otherwise.
            sudo dpkg --configure -a
          done
          echo "::error::apt command failed after 3 attempts"
          exit 1
          EOF
          chmod +x "$helper"
          echo "APT_WITH_FALLBACK=$helper" >> "$GITHUB_ENV"

          if ! grep -q 'azure\.archive\.ubuntu\.com' "$mirrors" 2>/dev/null; then
            echo "No Azure mirror configured; skipping the speed sample"
            exit 0
          fi
          set +e
          sudo apt-get update -qq
          # The printed URI may name the mirror+file: list rather than a host, so keep only the pool path.
          uri=$(apt-get download --print-uris -qq "$APT_MIRROR_SAMPLE_PACKAGE" | head -n 1 | cut -d"'" -f2)
          if [[ "$uri" != */pool/* ]]; then
            echo "::warning::Could not resolve a pool path for $APT_MIRROR_SAMPLE_PACKAGE; skipping the speed sample"
            exit 0
          fi
          url="http://azure.archive.ubuntu.com/ubuntu/pool/${uri#*/pool/}"
          speed=$(curl -fsS -o /dev/null --speed-limit "$APT_MIRROR_MIN_SPEED" --speed-time 10 --max-time 60 -w '%{speed_download}' "$url")
          status=$?
          echo "Sampled $url: exit $status, ${speed:-0} bytes/s"
          if [ "$status" -ne 0 ]; then
            echo "::warning::azure.archive.ubuntu.com is slow or unreachable (curl exit $status); dropping it from $mirrors"
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
          fi
          exit 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
          # required to avoid rtools bin in path
          windows-path-include-rtools: false

      - name: Set up rig
        uses: ./.github/actions/setup-rig

      - name: Install node (for Playwright, MECA)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Provision Playwright only for jobs that can run its assertions.
      - name: Cache multiplex server node_modules
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        uses: actions/cache@v5
        with:
          path: tests/integration/playwright/multiplex-server/node_modules
          key: ${{ runner.os }}-multiplex-server-${{ hashFiles('tests/integration/playwright/multiplex-server/package.json') }}
          restore-keys: |
            ${{ runner.os }}-multiplex-server-

      - name: Install node dependencies
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        run: npm install --loglevel=error --no-audit
        working-directory: ./tests/integration/playwright
        shell: bash

      - name: Get Playwright version
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "PLAYWRIGHT_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Browser builds are per OS release (e.g. WebKit links the distro's ICU),
          # but the install directory name is not, so the cache must not cross
          # OS releases (ubuntu 24.04 -> 26.04).
          if [ -r /etc/os-release ]; then
            . /etc/os-release
            HOST="$ID-$VERSION_ID"
          else
            HOST="macos-$(sw_vers -productVersion | cut -d. -f1)"
          fi
          echo "PLAYWRIGHT_HOST=$HOST" >> "$GITHUB_ENV"
        working-directory: ./tests/integration/playwright
        shell: bash

      - name: Cache Playwright browsers
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ env.PLAYWRIGHT_HOST }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PLAYWRIGHT_HOST }}-playwright-

      - name: Install Playwright system dependencies
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        timeout-minutes: 15
        run: |
          if [ -n "${APT_WITH_FALLBACK:-}" ]; then
            "$APT_WITH_FALLBACK" 'npx playwright install-deps'
          else
            npx playwright install-deps
          fi
        working-directory: ./tests/integration/playwright

      - name: Install Playwright Browsers
        if: >-
          runner.os != 'Windows'
          && (contains(inputs.buckets, 'playwright-tests.test.ts')
              || (format('{0}', inputs.buckets) == ''
                  && (inputs.quarto-install == 'dev' || inputs.quarto-install == '')))
        timeout-minutes: 15
        run: npx playwright install
        working-directory: ./tests/integration/playwright

      - name: Install MECA validator
        if: ${{ runner.os != 'Windows' }}
        run: npm install -g meca --loglevel=error --no-audit

      - name: Install missing system deps
        if: runner.os == 'Linux'
        run: |
          "$APT_WITH_FALLBACK" 'apt-get update -y &&
            apt-get install -y libcurl4-openssl-dev &&
            apt-get install -y libxml2-utils &&
            apt-get install -y libharfbuzz-dev libfribidi-dev &&
            apt-get install -y poppler-utils &&
            apt-get install -y libnode-dev'

      - name: Install rsvg-convert for SVG conversion tests
        # Only do it on linux runner, and only if we are running the relevant tests
        if: runner.os == 'Linux' && (format('{0}', inputs.buckets) == '' || contains(inputs.buckets, 'render-pdf-svg-conversion') || contains(inputs.buckets, 'pdf-standard'))
        run: |
          "$APT_WITH_FALLBACK" 'apt-get update -y && apt-get install -y librsvg2-bin'

      - name: Install missing system deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        # PDF tests need poppler and librsvg beyond the preinstalled tools.
        run: |
          brew install --cask xquartz
          brew install poppler librsvg

      - name: Sync R packages from rproj.lock
        working-directory: tests
        shell: bash
        run: |
          # Refs that predate the rig project are rejected by the preflight step after checkout.
          echo "::group::rig proj sync"
          rig proj sync --locked --no-install-r
          echo "::endgroup::"

      - name: Install dev and extra R packages
        working-directory: tests
        shell: bash
        env:
          EXTRA_R_PACKAGES: ${{ inputs.extra-r-packages }}
        run: |
          # Installs on top of the lock must target the project library and the
          # exact R the sync used; rig's default is the default R's user library.
          r_version=$(sed -n 's/^r-version = //p' .rvenv/rvenv.cfg | tr -d '\r')
          r_lib="$(cd .rvenv/lib && { pwd -W 2>/dev/null || pwd; })"
          overlay() { rig pkg install --r-version "$r_version" --library "$r_lib" "$@"; }

          echo "::group::Installing dev versions of knitr and rmarkdown"
          # Use r-universe to avoid GitHub API calls. A failed dev install keeps
          # the locked version; the check below flags it instead of failing setup.
          overlay --with-repos https://rstudio.r-universe.dev rmarkdown || true
          overlay --with-repos https://yihui.r-universe.dev knitr || true
          echo "::endgroup::"

          if [ -n "$EXTRA_R_PACKAGES" ]; then
            echo "::notice::Running with the following extra R packages: $EXTRA_R_PACKAGES"
            echo "::group::Installing extra R packages"
            specs=()
            IFS=',' read -ra items <<< "$EXTRA_R_PACKAGES"
            for item in "${items[@]}"; do
              item="${item#"${item%%[![:space:]]*}"}"
              item="${item%"${item##*[![:space:]]}"}"
              # renv's pkg@1.2.3 is an exact version; rig reads it as a minimum.
              if [[ "$item" =~ ^[A-Za-z][A-Za-z0-9.]*@[0-9] ]]; then item="${item/@/@=}"; fi
              specs+=("$item")
            done
            overlay "${specs[@]}"
            echo "::endgroup::"
          fi

          echo "::group::Installing sessioninfo"
          overlay sessioninfo
          echo "::endgroup::"

          # Run through the wrapper so the check sees the library the tests load.
          cat > .rvenv/ci-r-check.R <<'EOF'
          for (pkg in c("rmarkdown", "knitr")) {
            repo <- packageDescription(pkg)$Repository
            if (is.null(repo) || !grepl("r-universe.dev", repo, fixed = TRUE)) {
              cat(sprintf("::notice::Dev version of %s not installed; tests use %s from %s\n",
                          pkg, format(packageVersion(pkg)), if (is.null(repo)) "unknown source" else repo))
            }
          }
          cat("::group::Session info\n")
          sessioninfo::session_info(pkgs = "installed", include_base = TRUE)
          cat("::endgroup::\n")
          EOF
          .rvenv/bin/Rscript .rvenv/ci-r-check.R

      - name: Install uv for Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "tests/uv.lock"

      - name: Install Python and Dependencies
        working-directory: tests
        run: |
          uv sync --frozen

      # The harness needs the dev runtime even when testing another binary.
      - uses: ./.github/workflows/actions/quarto-dev

      - name: Set up release quarto
        if: inputs.quarto-install == 'release'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ inputs.quarto-version }}

      - name: Download built quarto artifact
        if: inputs.quarto-install == 'artifact' && inputs.quarto-artifact-run-id == ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.quarto-artifact-name }}
          path: ${{ runner.temp }}/quarto-artifact

      - name: Download built quarto artifact (from another run)
        if: inputs.quarto-install == 'artifact' && inputs.quarto-artifact-run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.quarto-artifact-name }}
          path: ${{ runner.temp }}/quarto-artifact
          run-id: ${{ inputs.quarto-artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Install built quarto outside the checkout (Windows)
        if: inputs.quarto-install == 'artifact' && runner.os == 'Windows'
        shell: pwsh
        # Git for Windows' bash ships GNU tar, which cannot read a zip archive,
        # and the Windows artifact is always a zip - so this step runs under
        # pwsh instead, where Expand-Archive handles it natively.
        run: |
          $zips = Get-ChildItem -Path "$env:RUNNER_TEMP/quarto-artifact" -Filter *.zip
          if ($zips.Count -ne 1) {
            Write-Host "::error::expected exactly one .zip in the quarto artifact, found: $($zips.Name -join ', ')"
            exit 1
          }
          $dest = "$env:RUNNER_TEMP/quarto-under-test"
          Expand-Archive -Path $zips[0].FullName -DestinationPath $dest -Force
          if (-not (Test-Path "$dest/bin")) {
            $tops = Get-ChildItem -Path $dest -Force -Directory
            if ($tops.Count -ne 1 -or -not (Test-Path (Join-Path $tops[0].FullName "bin"))) {
              Write-Host "::error::could not locate bin/ in the extracted quarto artifact"
              exit 1
            }
            Get-ChildItem -Path $tops[0].FullName -Force | Move-Item -Destination $dest
          }
          Add-Content $env:GITHUB_PATH "$dest/bin"

      - name: Install built quarto outside the checkout
        if: inputs.quarto-install == 'artifact' && runner.os != 'Windows'
        shell: bash
        # An in-checkout distribution would launch the dev sources.
        run: |
          mkdir -p "$RUNNER_TEMP/quarto-under-test"
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP"/quarto-artifact/*.tar.gz "$RUNNER_TEMP"/quarto-artifact/*.zip)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .tar.gz or .zip in the quarto artifact, found: ${artifacts[*]:-none}"
            exit 1
          fi
          # Linux has a top directory; macOS archives are flat.
          tar -xf "${artifacts[0]}" -C "$RUNNER_TEMP/quarto-under-test"
          if [ ! -d "$RUNNER_TEMP/quarto-under-test/bin" ]; then
            tops=("$RUNNER_TEMP"/quarto-under-test/*/)
            if [ "${#tops[@]}" -ne 1 ]; then
              echo "::error::expected exactly one directory in the extracted quarto artifact, found: ${#tops[@]}"
              exit 1
            fi
            top="${tops[0]%/}"
            if [ ! -d "$top/bin" ]; then
              echo "::error::could not locate bin/ in the extracted quarto artifact"
              exit 1
            fi
            shopt -s dotglob
            mv "$top"/* "$RUNNER_TEMP/quarto-under-test"/
          fi
          echo "$RUNNER_TEMP/quarto-under-test/bin" >> "$GITHUB_PATH"

      - name: Pin and verify test target
        if: inputs.quarto-install != 'dev' && inputs.quarto-install != ''
        shell: bash
        env:
          QUARTO_VERSION_INPUT: ${{ inputs.quarto-version }}
        run: |
          v="$(quarto --version)"
          echo "quarto under test: $v ($(command -v quarto))"
          if [ "$v" = "99.9.9" ]; then
            echo "::error::Quarto on PATH reports the dev version 99.9.9. The selected built or released Quarto was not installed."
            exit 1
          fi
          # Only build metadata preserves quarto-required range semantics.
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Quarto version '$v' is invalid for built-version tests. Use X.Y.Z or X.Y.Z+build metadata."
            exit 1
          fi
          # Older tags do not contain the binary-mode harness.
          if [ ! -f tests/quarto-cmd.ts ]; then
            echo "::error::This checkout lacks tests/quarto-cmd.ts. Use a ref with binary-mode harness support."
            exit 1
          fi
          # Convert the executable to a native Windows path for Deno.Command.
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$(command -v quarto.exe || command -v quarto.cmd || command -v quarto)"
            bin="$(cygpath -w "$bin")"
          else
            bin="$(command -v quarto)"
          fi
          echo "QUARTO_TEST_BIN=$bin" >> "$GITHUB_ENV"
          # Verify every spawn when the caller requested a concrete version.
          if [ -n "$QUARTO_VERSION_INPUT" ] \
            && [ "$QUARTO_VERSION_INPUT" != "pre-release" ] \
            && [ "$QUARTO_VERSION_INPUT" != "release" ]; then
            echo "QUARTO_TEST_EXPECTED_VERSION=$QUARTO_VERSION_INPUT" >> "$GITHUB_ENV"
          fi

      # Guarded at the step so runs on older refs, which lack this action, never load it.
      - if: inputs.pandoc-override-version != ''
        uses: ./.github/workflows/actions/pandoc-override
        with:
          pandoc-version: ${{ inputs.pandoc-override-version }}

      - name: Install Tinytex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          quarto install tinytex

      - name: Install veraPDF for PDF standard validation
        if: runner.os != 'Windows' && (format('{0}', inputs.buckets) == '' || contains(inputs.buckets, 'pdf-standard'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          quarto install verapdf

      - name: Cache Typst packages
        id: cache-typst
        uses: ./.github/actions/cache-typst

      - name: Install Chrome Headless Shell
        run: |
          quarto install chrome-headless-shell --no-prompt

      - name: Setup Julia
        uses: julia-actions/setup-julia@a8c65a2a580b6a5cf30070e825e62f9fc0fee1d7
        id: setup-julia
        with:
          version: "1.12.7"

      - name: Load Julia packages from cache
        uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};julia=${{ steps.setup-julia.outputs.julia-version }}

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Restore Julia Packages
        working-directory: tests
        shell: bash
        run: |
          # Setup IJulia with the jupyter from the Python environment
          # https://julialang.github.io/IJulia.jl/stable/manual/installation/
          export JUPYTER=$(find $(dirname $(uv run --frozen which jupyter))/ -type f -name "jupyter.exe" -o -name "jupyter")
          uv run --frozen julia --color=yes --project=. -e "import Pkg; Pkg.instantiate(); Pkg.build(\"IJulia\"); Pkg.precompile()"
          echo "Julia Jupyter:"
          uv run julia --project=. -e "import IJulia;println(IJulia.JUPYTER);println(IJulia.find_jupyter_subcommand(\"notebook\"))"

      - uses: ./.github/actions/merge-extension-tests

      - name: Setup timing file for timed test
        if: ${{ matrix.time-test == true }}
        run: |
          echo "QUARTO_TEST_TIMING=timing-for-ci.txt" >> "$GITHUB_ENV"

      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Run all Smoke Tests Windows
        if: ${{ runner.os == 'Windows' && format('{0}', inputs.buckets) == '' && matrix.time-test == false }}
        env:
          # Useful as TinyTeX latest release is checked in run-test.sh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./run-tests.ps1
        working-directory: tests
        shell: pwsh

      - name: Run all Smoke Tests Linux
        if: ${{ runner.os != 'Windows' && format('{0}', inputs.buckets) == '' }}
        env:
          # Useful as TinyTeX latest release is checked in run-test.sh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./run-tests.sh
        working-directory: tests
        shell: bash

      - name: Run Smoke Tests as a bucket on Linux
        if: ${{ runner.os != 'Windows' && format('{0}', inputs.buckets) != '' }}
        env:
          # Useful as TinyTeX latest release is checked in run-test.sh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUCKETS_JSON: ${{ inputs.buckets }}
          # Prevent the harness from duplicating this loop's workflow commands.
          QUARTO_TESTS_GHA_ORCHESTRATED: "1"
        run: |
          haserror=0
          failed_tests=()
          # Reject malformed and empty arrays instead of running zero buckets.
          if ! bucket_list=$(printf '%s' "$BUCKETS_JSON" | jq -e -rc '.[]' 2>&1); then
            echo "::error::BUCKETS_JSON is not a valid non-empty JSON array: $BUCKETS_JSON"
            echo "$bucket_list"
            exit 1
          fi
          # macOS Bash 3.2 does not provide readarray.
          my_array=()
          while IFS= read -r bucket; do
            my_array+=("$bucket")
          done <<< "$bucket_list"
          for file in "${my_array[@]}"; do
            echo "::group::Testing ${file}"
            echo ">>> ./run-tests.sh ${file}"
            # Run tests without -e so we don't exit on first failure
            set +e
            ./run-tests.sh "$file"
            status=$?
            set -e
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              echo "::error title=Test Bucket Failed::Test bucket ${file} failed with exit code ${status}"
              echo ">>> Error found in test file: ${file}"
              haserror=1
              failed_tests+=("$file")
            fi
          done
          if [ $haserror -eq 1 ]; then
            echo "---- FAILING TESTS SUMMARY ----"
            echo "    The following test buckets failed:"
            for failed in "${failed_tests[@]}"; do
              echo "    - $failed"
            done
            exit 1
          else
            echo ">>> All tests passed"
          fi
        working-directory: tests
        shell: bash

      - name: Run Smoke Tests as a bucket on Windows
        if: ${{ runner.os == 'Windows' && format('{0}', inputs.buckets) != '' }}
        env:
          # Useful as TinyTeX latest release is checked in run-test.sh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUCKETS_JSON: ${{ inputs.buckets }}
          # Prevent the harness from duplicating this loop's workflow commands.
          QUARTO_TESTS_GHA_ORCHESTRATED: "1"
        run: |
          $haserror=$false
          $failed_tests=@()
          $buckets=@($env:BUCKETS_JSON | ConvertFrom-Json)
          if ($buckets.Count -eq 0) {
            Write-Host "::error::BUCKETS_JSON resolved to zero test buckets: $env:BUCKETS_JSON"
            Exit 1
          }
          foreach ($file in $buckets) {
            Write-Host "::group::Testing ${file}"
            Write-Host ">>> ./run-tests.ps1 ${file}"
            ./run-tests.ps1 $file
            $status=$LASTEXITCODE
            Write-Host "::endgroup::"
            if ($status -ne 0) {
              Write-Host "::error title=Test Bucket Failed::Test bucket ${file} failed with exit code ${status}"
              Write-Host ">>> Error found in test file: ${file}"
              $haserror=$true
              $failed_tests+=$file
            }
          }
          if ($haserror) {
            Write-Host "---- FAILING TESTS SUMMARY ----"
            Write-Host "    The following test buckets failed:"
            foreach ($failed in $failed_tests) {
              Write-Host "    - $failed"
            }
            Exit 1
          } else {
            Write-Host ">>> All tests have passed"
          }
        working-directory: tests
        shell: pwsh

      - name: Upload test timing file
        uses: actions/upload-artifact@v7
        if: matrix.time-test
        with:
          name: timed test file
          path: tests/timing-for-ci.txt

      # A Deno segfault prints no stack; macOS writes one to a crash report.
      - name: Upload crash reports (macOS)
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          # Smoke and Playwright macOS legs share the run, and reruns reuse it.
          name: crash-reports-${{ runner.os }}-${{ format('{0}', inputs.buckets) == '' && 'full' || 'buckets' }}-attempt-${{ github.run_attempt }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 30

      # Saving after an interrupted restore would upload a partially extracted
      # cache under the exact key, which later runs then hit and never replace.
      - name: Save Typst cache
        if: ${{ !cancelled() && steps.cache-typst.outcome == 'success' && steps.cache-typst.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.cache-typst.outputs.cache-primary-key }}
          path: ${{ steps.cache-typst.outputs.cache-path }}

      - uses: actions/upload-artifact@v7
        # Include the OS because sibling jobs share the workflow run.
        if: ${{ !cancelled() && runner.os != 'Windows' && hashFiles('tests/integration/playwright/playwright-report/**/*') != '' }}
        with:
          name: playwright-report-${{ runner.os }}
          path: ./tests/integration/playwright/playwright-report/
          retention-days: 30
