<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour-scheme links, light only</title>

<!-- REGRESSION FIXTURE. A `_brand.yml` with no dark values makes Quarto emit
     the colour-scheme link machinery with `data-mode="light"` links but no
     `data-mode="dark"` build and no toggle. This page reproduces that markup by
     hand, because the probe that decides whether a theme cell can reuse its
     sibling runs per page, not per site — so one static page pins it without a
     second fixture project.

     The bug this guards: a probe asking for `[data-mode]` rather than
     `[data-mode="dark"]` matches the light links, concludes there is a dark
     theme to select, and scans the dark cells for nothing. Found on a real
     brand.yml site, 2026-08-20.

     Expected: both dark cells record `colorScheme: "assumed-identical"`. -->
<link rel="stylesheet" class="quarto-color-scheme" data-mode="light" href="brand-light-only.css">
<link rel="stylesheet" class="quarto-color-scheme-extra" data-mode="light" href="brand-light-only.css">
</head>
<body>
<main>
<h1>Colour-scheme links, light only</h1>

<p>This page carries `data-mode="light"` stylesheet links and no dark build, the
shape a light-only <code>_brand.yml</code> produces.</p>

<!-- PLANTED: button-name (critical), so the page has a finding to compare
     between the light cell and the reused dark one. A bare button rather than an
     alt-less image on purpose: an image here would normalize to `img` and join
     the systemic image-alt finding from _systemic.qmd, changing that finding's
     page list and coupling this regression fixture to an unrelated assertion. -->
<p><button></button></p>
</main>
</body>
</html>
