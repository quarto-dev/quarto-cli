# A brand with light values only — no `color.dark`, no dark palette. This is
# the whole fixture: Quarto responds by emitting `quarto-color-scheme` links
# tagged `data-mode="light"` (one of them a `quarto-color-alternate` pointing
# at a dark Bootstrap build) and no colour-scheme toggle. There is no dark
# theme to select, so the scanner must reuse each light cell for its dark
# sibling rather than scan twice.
#
# Do not add dark values here. That would make this site an ordinary two-theme
# site and delete the regression it guards.
color:
  palette:
    ink: "#1a1a1a"
    paper: "#ffffff"
  foreground: ink
  background: paper
  primary: "#2b6cb0"
