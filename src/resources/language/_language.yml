# Accessible name for the navigation landmark that holds the page links of a paginated listing (never shown as visible text).
# Read by screen readers so that users can find the page links; "Page" means a page of listing results, not a web page.
listing-page-navigation: "Page navigation"
# Accessible name for each numbered page link of a paginated listing (never shown as visible text); the link itself shows only the number.
# "Page" means a page of listing results, not a web page. {0} is the page number and must be kept.
listing-page-number: "Page {0}"
# Word count shown per item in a listing, e.g. "1,234 words"; {0} is the formatted number.
# A single string serves every count; pick the plural form that reads best for large numbers.
listing-page-words: "{0} words"
listing-page-filter: "Filter"

