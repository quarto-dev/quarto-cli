# Landmark labels. Two rules for translators:
# 1. Do not include the word "navigation". Screen readers announce the role after
#    the label (https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/).
# 2. Use a noun, not a bare adjective. In several languages the adjective cannot
#    stand alone without the noun it agrees with.
navigation-site-label: "Site"
navigation-section-label: "Section"
navigation-toolbar-label: "Toolbar"
navigation-page-label: "Page"
navigation-breadcrumbs-label: "Breadcrumbs"

# Accessible names for scrollable regions (never shown as visible text). One rule
# for translators: keep the word that says the region scrolls.
# It is the only thing that sets one of these apart from every other block.
scrollable-code-label: "Scrollable code"
scrollable-output-label: "Scrollable output"

# Announced by screen readers after a link that opens in a new tab (never shown as visible text).
# Describes the link (third person, "opens"), not a command; keep the parentheses.
# "Tab" is a browser tab, not a window or a tab control.
link-external-newwindow-label: "(opens in a new tab)"

# Accessible name for the button that dismisses a website announcement (never shown as visible text).
# "Dismiss" = close/hide the banner (the button shows only an X icon), not reject or delete.
# Imperative, like other button labels; use the language's usual "close" verb.
announcement-dismiss-label: "Dismiss announcement"

# Accessible name for the Reveal.js slide menu button (never shown as visible text).
# "Slide" is a presentation slide (PowerPoint sense); use a noun phrase, not a command.
revealjs-menu-button-label: "Slide menu"

